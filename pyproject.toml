[project]
name = "teton-streaming-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httptools>=0.9.0",
    "orjson>=3.13.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
